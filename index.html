   <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loja de Games Retrô</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Games Retrô 🎮</h1>
        <p>Venda de Games Retrô</p>
    </header>

    <main class="container">

        <div class="titulo-secao">
            <div>
                <h2>Nosso Catálogo:</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>

            <button id="btnCadastrar" type="button">
                + Cadastrar Game
            </button>
        </div>

        <section id="listarGames" class="listar-games">
            <p id="mensagemVazia">Nenhum game cadastrado</p>
        </section>

    </main>

    <dialog id="modalCadastro">

        <h2>Novo Jogo</h2>

        <form id="formGame">

            <label for="titulo">Título do Game</label>
            <input
                type="text"
                id="titulo"
                placeholder="Ex.: Minecraft"
                required
            >

            <label for="plataforma">Plataforma</label>
            <input
                type="text"
                id="plataforma"
                placeholder="Ex.: PC, PlayStation 5"
                required
            >

            <label for="desenvolvedora">Desenvolvedora</label>
            <input
                type="text"
                id="desenvolvedora"
                placeholder="Ex.: Mojang"
                required
            >

            <label for="imagem">URL da imagem do game</label>
            <input
                type="url"
                id="imagem"
                placeholder="https://site.com/imagem.jpg"
                required
            >

            <label for="preco">Preço (R$)</label>
            <input
                type="number"
                id="preco"
                min="0"
                step="0.01"
                placeholder="Ex.: 99.90"
                required
            >

            <div class="acoes">

                <button
                    type="button"
                    id="btnCancelar"
                    class="cancelar"
                >
                    Cancelar
                </button>

                <button type="submit">
                    Salvar Jogo
                </button>

            </div>

        </form>

    </dialog>

    <script src="script.js"></script>

</body>
</html>
